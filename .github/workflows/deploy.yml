name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch: {}

# EC2 mutates fixed-name containers (pulse-app, pulse-app-prev) — two overlapping
# deploys race on the same host. Never cancel an in-flight run: the GitHub job
# stopping does not stop the already-dispatched SSM command, so cancelling here
# would just let a second swap start while the first is still mutating containers.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build, push, and roll out to EC2
    runs-on: ubuntu-latest
    # Waits for the owner's approval click (required reviewer on this environment); the
    # deploy role's trust policy only accepts tokens from this environment
    environment: aws-production
    # The repo is public and CI also runs on fork pull requests, and a fork branch can be named
    # `main`, so the `branches` filter above is not enough. Only deploy a CI run that was a push
    # to this repository's own main branch.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main') }}

    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::110015905368:role/pulse-server-gh-deploy-role
          aws-region: eu-central-1

      - name: Log in to ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Build and push runner image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runner
          push: true
          tags: |
            110015905368.dkr.ecr.eu-central-1.amazonaws.com/pulse-server-app:runner-${{ env.DEPLOY_SHA }}
            110015905368.dkr.ecr.eu-central-1.amazonaws.com/pulse-server-app:runner-latest

      - name: Build and push migrate image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: builder
          push: true
          tags: |
            110015905368.dkr.ecr.eu-central-1.amazonaws.com/pulse-server-app:migrate-${{ env.DEPLOY_SHA }}
            110015905368.dkr.ecr.eu-central-1.amazonaws.com/pulse-server-app:migrate-latest

      - name: Trigger redeploy on EC2 via SSM
        id: deploy
        run: |
          SHA="${{ env.DEPLOY_SHA }}"
          # `timeout` hard-caps the remote script below the workflow's own poll
          # budget (900s) so the two sides can't disagree — the remote side is
          # cut off before the workflow gives up on it, instead of continuing to
          # mutate production after the job has already reported a timeout.
          jq -n --rawfile script scripts/deploy/ec2-redeploy.sh --arg sha "$SHA" \
            '{commands: [("cat <<'"'"'DEPLOY_SCRIPT_EOF'"'"' > /tmp/redeploy.sh\n" + $script + "\nDEPLOY_SCRIPT_EOF"), ("timeout 780 bash /tmp/redeploy.sh " + $sha)]}' \
            > /tmp/ssm-params.json

          CMD_ID=$(aws ssm send-command \
            --targets Key=tag:Name,Values=pulse-server \
            --document-name AWS-RunShellScript \
            --parameters file:///tmp/ssm-params.json \
            --timeout-seconds 900 \
            --region eu-central-1 \
            --query "Command.CommandId" --output text)
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for redeploy to finish
        run: |
          # Budget: image pulls + migration + blue/green health checks (up to ~2 min
          # of curl polling alone) can comfortably exceed 5 minutes on a cold cache.
          # Targeted by tag (the ASG replaces the instance), so resolve which instance
          # actually received the command.
          INSTANCE_ID=None
          for i in $(seq 1 12); do
            INSTANCE_ID=$(aws ssm list-command-invocations \
              --command-id "${{ steps.deploy.outputs.command_id }}" \
              --region eu-central-1 \
              --query "CommandInvocations[0].InstanceId" --output text)
            [ "$INSTANCE_ID" != "None" ] && break
            sleep 5
          done
          if [ "$INSTANCE_ID" = "None" ]; then
            echo "No instance matched the pulse-server tag."
            exit 1
          fi
          for i in $(seq 1 90); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${{ steps.deploy.outputs.command_id }}" \
              --instance-id "$INSTANCE_ID" \
              --region eu-central-1 \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "status: $STATUS"
            if [ "$STATUS" = "Success" ]; then exit 0; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "--- stdout ---"
              aws ssm get-command-invocation \
                --command-id "${{ steps.deploy.outputs.command_id }}" \
                --instance-id "$INSTANCE_ID" \
                --region eu-central-1 \
                --query "StandardOutputContent" --output text
              echo "--- stderr ---"
              aws ssm get-command-invocation \
                --command-id "${{ steps.deploy.outputs.command_id }}" \
                --instance-id "$INSTANCE_ID" \
                --region eu-central-1 \
                --query "StandardErrorContent" --output text
              exit 1
            fi
            sleep 10
          done
          echo "Timed out waiting for deploy command."
          exit 1

      - name: Verify live
        run: |
          curl -sf https://pulserehab.app/api/status
