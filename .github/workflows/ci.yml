name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  unit:
    name: Typecheck · Lint · Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DEV_DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint:check

      - name: Unit tests (with coverage gate)
        run: npm test

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Start Postgres
        run: |
          pulled=
          for image in public.ecr.aws/docker/library/postgres:16-alpine mirror.gcr.io/library/postgres:16-alpine postgres:16-alpine; do
            for attempt in 1 2 3; do
              if docker pull "$image"; then pulled=$image; break 2; fi
              sleep $((attempt * 10))
            done
          done
          if [ -z "$pulled" ]; then
            echo "::error::could not pull a postgres image from any registry"
            exit 1
          fi
          docker run -d --name pg -p 5432:5432 -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=pulse_test "$pulled"
          for i in $(seq 1 30); do
            if docker exec pg pg_isready -U postgres; then exit 0; fi
            sleep 2
          done
          echo "::error::postgres did not become ready"
          exit 1

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DEV_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pulse_test

      - name: Integration tests
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pulse_test
