# RabbitMQ settings for the app box (draft, 18 Nov 2026, not deployed).
# The vhost, exchanges and queues come from definitions.json. The application
# user is created by create-node-user.sh after the first start, because a user in
# the definitions file would need a password hash.
load_definitions = /etc/rabbitmq/definitions.json

# The memory watermark is where RabbitMQ blocks publishers, not a hard cap: the
# container limit in docker-compose.yml is what stops it. Set from the load test
# (H4, 23 Nov): at 192 MiB the alarm fired six times under 60 virtual users and
# held publishers for minutes, so the watermark is 256 MiB under a 384 MiB limit.
vm_memory_high_watermark.absolute = 256MiB
# Measured from the broker's own allocators, not from the process size the host reports:
# with the default (rss) the alarm switched on and off every few minutes at 70 MB of use,
# also with no load, and every switch blocked publishers.
vm_memory_calculation_strategy = allocated
disk_free_limit.absolute = 512MiB
