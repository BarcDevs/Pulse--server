# RabbitMQ settings for the app box (draft, 18 Nov 2026, not deployed).
# The vhost, exchanges and queues come from definitions.json. The application
# user is created by create-node-user.sh after the first start, because a user in
# the definitions file would need a password hash.
load_definitions = /etc/rabbitmq/definitions.json

# The memory watermark is where RabbitMQ blocks publishers, not a hard cap: the
# container limit in docker-compose.yml is what stops it. Starting value, to be
# set from a real reading after the load test (finding 8).
vm_memory_high_watermark.absolute = 192MiB
disk_free_limit.absolute = 512MiB
